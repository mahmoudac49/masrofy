<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masrofy - Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>💰 Masrofy</h1>
    <p class="subtitle">Track your expenses and know where your money goes</p>

    <div class="form">
      <input type="text" id="name" placeholder="Expense name - e.g. Lunch">
      <input type="number" id="amount" placeholder="Amount">
      
      <select id="category">
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Other">Other</option>
      </select>

      <button onclick="addExpense()">Add Expense</button>
    </div>

    <div class="summary">
      <h3>Total: <span id="total">0</span> EGP</h3>
      <p>Food: <span id="foodTotal">0</span> | Transport: <span id="transportTotal">0</span> | Entertainment: <span id="entertainmentTotal">0</span></p>
    </div>

    <h2>Expenses:</h2>
    <ul id="list"></ul>
    <button class="clear-btn" onclick="clearAll()">Clear All</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
